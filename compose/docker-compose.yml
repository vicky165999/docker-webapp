services:
  app:
    container_name: app-cont
    image: vicky1625/webapp:javaapp
    ports:
      - '1111:8080'
    depends_on:
      - devopsdb

  devopsdb:
    container_name: devopsdb
    image: vicky1625/webapp:db
    ports:
      - '1112:3306'
    volumes:
      - myvolume:/var/lib/mysql/


volumes:
  myvolume:
